<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title></title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }
    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      background: #08090d;
    }
    button {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      border: 1px solid #454750;
      border-radius: 50%;
      background: #171920;
      color: #f5f5f7;
      font-size: 27px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 0 28px rgba(255,255,255,.06);
    }
    button:active {
      transform: scale(.94);
      background: #252833;
    }
    button:focus-visible {
      outline: 2px solid #b9bdca;
      outline-offset: 5px;
    }
  </style>
</head>
<body>
  <button id="soundButton" type="button" aria-label="Putar atau hentikan suara">▶</button>
  <audio id="sound" src="musik.mp3" preload="none" loop></audio>

  <script>
    const sound = document.getElementById("sound");
    const button = document.getElementById("soundButton");

    button.addEventListener("click", async () => {
      if (sound.paused) {
        try {
          await sound.play();
          button.textContent = "Ⅱ";
        } catch (error) {
          alert("Audio belum tersedia. Pastikan file musik.mp3 sudah diunggah bersama index.html.");
        }
      } else {
        sound.pause();
        button.textContent = "▶";
      }
    });
  </script>
</body>
</html>
